name: Pronostics Ligue 1

on:
  schedule:
    # Tous les jours à 6h00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permet de déclencher manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer les pronostics et le dashboard
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          API_FOOTBALL_TOKEN: ${{ secrets.API_FOOTBALL_TOKEN }}
        run: |
          python -m src.main \
            --output predictions/derniere-journee.md \
            --html-output docs/index.html

      - name: Committer les résultats si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/derniere-journee.md docs/index.html
          git diff --cached --quiet || git commit -m "Mise à jour automatique des pronostics Ligue 1"
          git push
